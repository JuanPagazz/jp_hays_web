<section class="texto">

                    fill="none" 
                    stroke="#5C82FF" 
                    stroke-width="6" 
                    stroke-linecap="round"/>

                    fill="none" 
                    stroke="#5C82FF" 
                    stroke-width="7" 
                    stroke-linecap="round"
