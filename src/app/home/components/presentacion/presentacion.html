<section>
    <h4>{{ translations.home().presentation.greeting }}</h4>
    <h2>{{ translations.home().presentation.role }}<span class="titulo-verde">{{ translations.home().presentation.frontend }}</span></h2>
    <p>{{ translations.home().presentation.description }}</p>
    <div class="tecnologias">
        <div class="tecnologia">
            <img [attr.src]="loadImages ? 'angular-icon.png' : null" alt="Angular" width="219" height="229" [attr.loading]="loadImages ? 'eager' : 'lazy'" decoding="async">
            <p>Angular</p>
        </div>
        <div class="tecnologia">
            <img [attr.src]="loadImages ? 'html-icon.png' : null" alt="HTML" width="172" height="209" [attr.loading]="loadImages ? 'eager' : 'lazy'" decoding="async">
            <p>HTML</p>
        </div>
        <div class="tecnologia">
            <img [attr.src]="loadImages ? 'css-icon.png' : null" alt="CSS" width="187" height="211" [attr.loading]="loadImages ? 'eager' : 'lazy'" decoding="async">
            <p>CSS</p>
        </div>
        <div class="tecnologia">
            <img [attr.src]="loadImages ? 'js-icon.png' : null" alt="JavaScript" width="197" height="203" [attr.loading]="loadImages ? 'eager' : 'lazy'" decoding="async">
            <p>JavaScript</p>
        </div>
    </div>
</section>
