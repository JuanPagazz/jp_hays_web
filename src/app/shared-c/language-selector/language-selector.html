<mat-button-toggle-group name="language" [value]="languageService.language()" (change)="changeLanguage($event)" class="selector-idioma">
    <mat-button-toggle value="es" aria-label="Cambiar idioma a español">ES</mat-button-toggle>
    <mat-button-toggle value="en" aria-label="Cambiar idioma a inglés">EN</mat-button-toggle>
</mat-button-toggle-group>
