<mat-button-toggle-group name="language" [value]="languageService.language()" (change)="changeLanguage($event)" class="selector-idioma">
    <mat-button-toggle value="es" aria-label="{{ translations.home().navigation.spanish}}">ES</mat-button-toggle>
    <mat-button-toggle value="en" aria-label="{{ translations.home().navigation.english }}">EN</mat-button-toggle>
</mat-button-toggle-group>
